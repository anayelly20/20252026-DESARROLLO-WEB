<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Proyecto Bootstrap</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

  <!-- CSS propio -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ===== NAVBAR ===== -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="#">MI PROYECTO aparatos tecnologicos</a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div id="menu" class="collapse navbar-collapse">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="#">Inicio</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Productos</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Contacto</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- ===== CARRUSEL ===== -->
<div id="carouselExample" class="carousel slide mt-3" data-bs-ride="carousel">
  <div class="carousel-inner">
    <div class="carousel-item active">
      <img src="https://www.globatecrd.com/wp-content/uploads/2023/02/asus-rog-f5333zm.jpg" class="d-block w-100">
    </div>
    <div class="carousel-item">
      <img src="https://de2kqc9pq55cj.cloudfront.net/fit-in/700x700/filters:fill(FFFFFF):quality(90):format(webp)/_img_productos/auriculares-bluetooth-y70-851330-foto1.jpg" class="d-block w-100">
    </div>
    <div class="carousel-item">
      <img src="https://bestpc.ec/wp-content/uploads/2025/01/celulares-en-quito-honor-magic-7-lite-ecuador.jpg" class="d-block w-100">
    </div>
  </div>
</div>

<!-- ===== BOTÓN ALERTA ===== -->
<div class="container text-center my-4">
  <button id="btnAlerta" class="btn btn-danger">
    Mostrar Alerta
  </button>
</div>

<!-- ===== TABLA PRODUCTOS ===== -->
<div class="container">
  <h3 class="text-center">Lista de Productos</h3>
  <table class="table table-hover table-bordered text-center">
    <thead class="table-dark">
      <tr>
        <th>#</th>
        <th>Producto</th>
        <th>Precio</th>
      </tr>
    </thead>
    <tbody id="tablaProductos">
      <tr>
        <td>1</td>
        <td>Laptop</td>
        <td>$1200</td>
      </tr>
      <tr>
        <td>2</td>
        <td>Celular</td>
        <td>$800</td>
      </tr>
    </tbody>
  </table>
</div>

<!-- ===== AÑADIR PRODUCTO ===== -->
<div class="container my-5">
  <h3 class="text-center">Añadir Producto</h3>
  <form id="formProducto" class="row g-3 shadow p-4 rounded">
    <div class="col-md-4">
      <input type="text" id="nombreProducto" class="form-control" placeholder="Nombre">
    </div>
    <div class="col-md-4">
      <input type="number" id="precioProducto" class="form-control" placeholder="Precio">
    </div>
    <div class="col-md-4 d-grid">
      <button class="btn btn-success">Agregar</button>
    </div>
  </form>
</div>

<!-- ===== FORMULARIO CONTACTO ===== -->
<div class="container mb-5">
  <h3 class="text-center">Contacto</h3>
  <form id="formContacto" class="shadow p-4 rounded">
    <input type="text" id="nombre" class="form-control mb-3" placeholder="Nombre">
    <input type="email" id="correo" class="form-control mb-3" placeholder="Correo">
    <textarea id="mensaje" class="form-control mb-3" placeholder="Mensaje"></textarea>
    <button class="btn btn-primary w-100">Enviar</button>
  </form>
</div>

<!-- ===== FOOTER ===== -->
<footer class="bg-dark text-white text-center p-3">
  © 2026 - Redes Sociales ANA LOPEZ |
  <i class="bi bi-facebook"></i>
  <i class="bi bi-instagram"></i>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- JS propio -->
<script src="script.js"></script>
</body>
</html>
