{% extends 'base.html' %}

{% block contenido %}

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-body">
                    <h2 class="card-title mb-4">💉 Registrar Historial Médico</h2>
                    
                    <form action="/guardar_historial" method="POST">
                        <div class="mb-3">
                            <label for="mascota_id" class="form-label">Selecciona la mascota</label>
                            <select class="form-control" id="mascota_id" name="mascota_id" required>
                                <option value="">Selecciona una mascota</option>
                                {% for mascota in mascotas %}
                                <option value="{{ mascota[0] }}">{{ mascota[1] }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="tipo" class="form-label">Tipo de registro</label>
                            <select class="form-control" id="tipo" name="tipo" required>
                                <option value="">Selecciona un tipo</option>
                                <option value="Vacuna">💉 Vacuna</option>
                                <option value="Tratamiento">🏥 Tratamiento</option>
                                <option value="Cirugía">🔪 Cirugía</option>
                                <option value="Desparasitación">🐛 Desparasitación</option>
                                <option value="Revisión">🩺 Revisión</option>
                                <option value="Otro">Otro</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="descripcion" class="form-label">Descripción</label>
                            <textarea class="form-control" id="descripcion" name="descripcion" rows="3" required placeholder="Detalles del procedimiento o tratamiento..."></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="fecha" class="form-label">Fecha del registro</label>
                            <input type="date" class="form-control" id="fecha" name="fecha" required>
                        </div>

                        <div class="mb-3">
                            <label for="veterinario" class="form-label">Veterinario responsable</label>
                            <input type="text" class="form-control" id="veterinario" name="veterinario" required>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success btn-lg">💾 Guardar Registro</button>
                            <a href="/historial" class="btn btn-secondary">← Volver</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
