{% extends 'base.html' %}

{% block contenido %}

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-body">
                    <h2 class="card-title mb-4">📅 Agendar Nueva Cita</h2>
                    
                    <form action="/guardar_cita" method="POST">
                        <div class="mb-3">
                            <label for="mascota_id" class="form-label">Selecciona la mascota</label>
                            <select class="form-control" id="mascota_id" name="mascota_id" required>
                                <option value="">Selecciona una mascota</option>
                                {% for mascota in mascotas %}
                                <option value="{{ mascota[0] }}">{{ mascota[1] }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="fecha" class="form-label">Fecha de la cita</label>
                            <input type="date" class="form-control" id="fecha" name="fecha" required>
                        </div>

                        <div class="mb-3">
                            <label for="hora" class="form-label">Hora de la cita</label>
                            <input type="time" class="form-control" id="hora" name="hora" required>
                        </div>

                        <div class="mb-3">
                            <label for="motivo" class="form-label">Motivo de la consulta</label>
                            <textarea class="form-control" id="motivo" name="motivo" rows="3" required></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="veterinario" class="form-label">Veterinario asignado</label>
                            <input type="text" class="form-control" id="veterinario" name="veterinario" required>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success btn-lg">💾 Guardar Cita</button>
                            <a href="/citas" class="btn btn-secondary">← Volver</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
