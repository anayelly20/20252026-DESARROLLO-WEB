{% extends 'base.html' %}

{% block contenido %}

<div class="card shadow p-4">
    <h3 class="text-warning">✏️ Editar Mascota</h3>

    <form action="{{ url_for('editar_mascota', id=mascota[0]) }}" method="POST">

        <input type="text" name="nombre" value="{{ mascota[1] }}" class="form-control mb-3" required>
        <input type="text" name="especie" value="{{ mascota[2] }}" class="form-control mb-3" required>
        <input type="text" name="raza" value="{{ mascota[3] }}" class="form-control mb-3" required>
        <input type="number" name="edad" value="{{ mascota[4] }}" class="form-control mb-3" required>
        <input type="text" name="propietario" value="{{ mascota[5] }}" class="form-control mb-3">
        <input type="text" name="telefono" value="{{ mascota[6] }}" class="form-control mb-3">

        <button class="btn btn-warning w-100">Actualizar</button>

    </form>
</div>

{% endblock %}
