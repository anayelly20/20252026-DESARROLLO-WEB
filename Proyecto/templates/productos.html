{% extends 'base.html' %}

{% block contenido %}

<h2>🛒 Productos</h2>

<a href="/nuevo" class="btn btn-primary mb-3">➕ Nuevo producto</a>

<table class="table table-bordered table-striped shadow">
    <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Descripción</th>
            <th>Precio</th>
            <th>Cantidad</th>
            <th>Acciones</th>
        </tr>
    </thead>

    <tbody>
        {% for p in productos %}
        <tr>
            <td>{{ p[0] }}</td>
            <td>{{ p[1] }}</td>
            <td>{{ p[2] }}</td>
            <td>${{ p[3] }}</td>
            <td>{{ p[4] }}</td>
            <td>
                <a href="/editar/{{p[0]}}" class="btn btn-warning btn-sm">Editar</a>
                <a href="/eliminar/{{p[0]}}" class="btn btn-danger btn-sm">Eliminar</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
