{% extends 'base.html' %}

{% block contenido %}

<div class="card shadow p-4">
    <h3 class="text-warning">✏️ Editar Producto</h3>

    <form action="/actualizar/{{ producto[0] }}" method="POST">

        <input type="text" name="nombre"
        value="{{ producto[1] }}" class="form-control mb-3">

        <textarea name="descripcion"
        class="form-control mb-3">{{ producto[2] }}</textarea>

        <input type="number" name="precio"
        value="{{ producto[3] }}" class="form-control mb-3">

        <input type="number" name="cantidad"
        value="{{ producto[4] }}" class="form-control mb-3">

        <button class="btn btn-warning w-100">
            Actualizar
        </button>

    </form>
</div>

{% endblock %}
