<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>🐾 Veterinaria DAG</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f5f7f6;
        }

        .navbar {
            background: linear-gradient(90deg, #2e7d32, #43a047);
        }

        .navbar-brand {
            font-weight: bold;
            font-size: 20px;
        }

        .nav-btn {
            margin-left: 5px;
        }

        .card {
            border-radius: 12px;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark shadow">
    <div class="container">

        <a href="/" class="navbar-brand">🐾 Veterinaria DAG</a>

        <div class="ms-auto">
            {% if current_user.is_authenticated %}
                <!-- Menú para usuarios autenticados -->
                <a href="/" class="btn btn-light nav-btn">🏠 Inicio</a>
                <a href="/productos" class="btn btn-light nav-btn">🛒 Productos</a>
                <a href="/reportes" class="btn btn-light nav-btn">📄 Reportes</a>
                <a href="/nuevo" class="btn btn-success nav-btn">➕ Agregar</a>
                <a href="/logout" class="btn btn-danger nav-btn">🚪 Salir</a>
            {% else %}
                <!-- Menú para usuarios no autenticados -->
                <a href="/" class="btn btn-light nav-btn">🏠 Inicio</a>
                <a href="/login" class="btn btn-success nav-btn">🔐 Ingresar</a>
                <a href="/registro" class="btn btn-info nav-btn">📝 Registrarse</a>
            {% endif %}
        </div>

    </div>
</nav>

<!-- CONTENIDO -->
<div class="container mt-4">
    {% block contenido %}{% endblock %}
</div>

<!-- FOOTER -->
<footer class="text-center mt-5 mb-3 text-muted">
    <small>© 2026 Veterinaria DAG 🐶 | Sistema de gestión</small>
</footer>

</body>
</html>
