<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Usuario</title>

  <!-- RUTA EXACTA AL CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="container">
    <h1>Registro de Usuario</h1>

    <form id="registroForm" novalidate>

      <div class="field">
        <label>Nombre completo *</label>
        <input type="text" id="nombre">
        <small id="nombreError">Mínimo 3 letras</small>
      </div>

      <div class="field">
        <label>Correo electrónico *</label>
        <input type="email" id="email">
        <small id="emailError">Correo no válido</small>
      </div>

      <div class="field">
        <label>Contraseña *</label>
        <input type="password" id="password">
        <small id="passwordError">Mínimo 8 caracteres</small>
      </div>

      <div class="field">
        <label>Confirmar contraseña *</label>
        <input type="password" id="confirmPassword">
        <small id="confirmPasswordError">No coinciden</small>
      </div>

      <div class="field">
        <label>Edad *</label>
        <input type="number" id="edad">
        <small id="edadError">Debe ser mayor de 18</small>
      </div>

      <div class="actions">
        <button type="submit" id="btnEnviar" disabled>Enviar</button>
        <button type="reset" class="secondary">Reiniciar</button>
      </div>

      <p class="hint">* Campos obligatorios</p>
    </form>

    <div id="mensajeExito" class="success-message">
      ✔ Registro exitoso
    </div>
  </main>

  <!-- RUTA EXACTA AL JS -->
  <script src="script.js"></script>

</body>
</html>
