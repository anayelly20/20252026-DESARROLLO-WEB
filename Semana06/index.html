<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Usuario</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      height: 100vh;
      background: linear-gradient(135deg,#667eea,#764ba2);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      background: white;
      padding: 30px;
      width: 360px;
      border-radius: 15px;
      box-shadow: 0 20px 40px rgba(0,0,0,.3);
      animation: aparecer .8s ease;
    }

    @keyframes aparecer {
      from { opacity: 0; transform: translateY(-30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    .field {
      margin-bottom: 12px;
    }

    label {
      font-weight: bold;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 8px;
      border: 2px solid #ccc;
      transition: .3s;
    }

    input:focus {
      outline: none;
      transform: scale(1.02);
    }

    /* Colores por campo */
    #nombre { border-color: #3b82f6; }
    #email { border-color: #f59e0b; }

    input.valid {
      border-color: #10b981;
      background: #f0fdf4;
    }

    input.invalid {
      border-color: #ef4444;
      background: #fef2f2;
    }

    small {
      font-size: 12px;
      color: #ef4444;
      display: none;
    }

    small.show {
      display: block;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
      transition: .3s;
    }

    button:hover {
      transform: scale(1.05);
    }

    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    #btnEnviar {
      background: #667eea;
      color: white;
    }

    .secondary {
      background: #e5e7eb;
    }

    .success-message {
      margin-top: 15px;
      text-align: center;
      color: #10b981;
      font-weight: bold;
      display: none;
    }

    .hint {
      font-size: 12px;
      margin-top: 10px;
      text-align: center;
      color: #555;
    }
  </style>
</head>

<body>

  <main class="container">
    <h1>Registro de Usuario</h1>

    <form id="registroForm" novalidate>

      <div class="field">
        <label>Nombre completo *</label>
        <input type="text" id="nombre">
        <small id="nombreError">Mínimo 3 letras</small>
      </div>

      <div class="field">
        <label>Correo electrónico *</label>
        <input type="email" id="email">
        <small id="emailError">Correo no válido</small>
      </div>

      <div class="field">
        <label>Contraseña *</label>
        <input type="password" id="password">
        <small id="passwordError">Mínimo 8 caracteres</small>
      </div>

      <div class="field">
        <label>Confirmar contraseña *</label>
        <input type="password" id="confirmPassword">
        <small id="confirmPasswordError">No coinciden</small>
      </div>

      <div class="field">
        <label>Edad *</label>
        <input type="number" id="edad">
        <small id="edadError">Debe ser mayor de 18</small>
      </div>

      <div class="actions">
        <button type="submit" id="btnEnviar" disabled>Enviar</button>
        <button type="reset" class="secondary">Reiniciar</button>
      </div>

      <p class="hint">* Campos obligatorios</p>
    </form>

    <div id="mensajeExito" class="success-message">
      ✔ Registro exitoso
    </div>
  </main>

  <script>
    const f = id => document.getElementById(id);
    const btn = f("btnEnviar");
    const exito = f("mensajeExito");

    const estado = { n:false, e:false, p:false, c:false, edad:false };

    function activar() {
      btn.disabled = !Object.values(estado).every(v => v);
    }

    f("nombre").oninput = e => {
      estado.n = e.target.value.length >= 3;
      validar("nombre","nombreError",estado.n);
    };

    f("email").oninput = e => {
      estado.e = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e.target.value);
      validar("email","emailError",estado.e);
    };

    f("password").oninput = e => {
      estado.p = e.target.value.length >= 8;
      validar("password","passwordError",estado.p);
    };

    f("confirmPassword").oninput = e => {
      estado.c = e.target.value === f("password").value && estado.p;
      validar("confirmPassword","confirmPasswordError",estado.c);
    };

    f("edad").oninput = e => {
      estado.edad = e.target.value >= 18;
      validar("edad","edadError",estado.edad);
    };

    function validar(inputId, errorId, ok) {
      const i = f(inputId);
      const e = f(errorId);
      i.className = ok ? "valid" : "invalid";
      e.classList.toggle("show", !ok);
      activar();
    }

    f("registroForm").onsubmit = e => {
      e.preventDefault();
      exito.style.display = "block";
      setTimeout(() => exito.style.display = "none", 3000);
    };
  </script>

</body>
</html>
